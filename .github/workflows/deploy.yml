name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    # 발행일이 된 예약 글을 내보낸다 — 중국어 수업 06:00, 일본어 07:00 KST 라 그 5분 뒤에 (GitHub 스케줄은 몇 분 늦을 수 있다)
    - cron: '5 21 * * *'    # 06:05 KST
    - cron: '5 22 * * *'    # 07:05 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build site
        # 2026-11-08 daytip.kr 로 옮김 — 도메인 루트에서 서비스하므로 BASE_PATH 는 비운다 (테스트 주소로 돌리려면 /daytip)
        run: node tools/build.mjs
        env:
          BASE_PATH: ""
      - name: Check links
        run: node tools/check-links.mjs
        env:
          BASE_PATH: ""
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
