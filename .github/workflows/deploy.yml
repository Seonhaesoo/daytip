name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    # 발행일이 된 예약 글을 내보낸다 — 중국어 수업 06:00, 일본어 07:00 KST 라 그 5분 뒤에 (GitHub 스케줄은 몇 분 늦을 수 있다)
    - cron: '5 21 * * *'    # 06:05 KST
    - cron: '5 22 * * *'    # 07:05 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 비밀 값 자체가 아니라 "있다/없다" 만 — 단계의 if 에서 쓴다 (secrets 는 if 에서 바로 못 읽는다)
      HAS_GA: ${{ secrets.GA_KEY_JSON != '' && secrets.GA_PROPERTY_ID != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch visitor stats
        # /admin/ 의 방문자 칸 — GA4 Data API 에서 data/admin/stats.json 을 받아 이번 빌드만 쓴다(커밋하지 않는다).
        # 비밀 값이 없으면 건너뛰고, 받다가 실패해도 배포는 계속한다(스크립트가 종료 코드 0 으로 끝난다).
        if: env.HAS_GA == 'true'
        run: node tools/fetch-ga.mjs
        env:
          GA_KEY_JSON: ${{ secrets.GA_KEY_JSON }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
      - name: Build site
        # 2026-11-08 daytip.kr 로 옮김 — 도메인 루트에서 서비스하므로 BASE_PATH 는 비운다 (테스트 주소로 돌리려면 /daytip)
        # ADMIN_PASSWORD 는 이 단계에만 준다 — /admin/ 본문을 이 비밀번호로 암호화한다. 없으면 자료 없는 "아직 설정되지 않았어요" 쪽만 나간다.
        run: node tools/build.mjs
        env:
          BASE_PATH: ""
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      - name: Check links
        run: node tools/check-links.mjs
        env:
          BASE_PATH: ""
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # 사이트가 260MB 남짓이라(음원·그림) 기본 10분 안에 파일 동기화가 안 끝날 때가 있다 — 2026-11-10 두 번 연달아 시간 초과
          timeout: 1800000
