name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 22 * * *'   # 매일 07:30 KST — 발행일이 된 예약 글을 내보낸다 (글은 06:00·07:00 KST 발행)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build site
        # 테스트 주소 seonhaesoo.github.io/daytip/ 용. daytip.kr 로 옮길 때 BASE_PATH 를 비운다
        run: node tools/build.mjs
        env:
          BASE_PATH: /daytip
      - name: Check links
        run: node tools/check-links.mjs
        env:
          BASE_PATH: /daytip
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
